<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#020010">
<title>1×1 Runner</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
body { background:#020010; overflow:hidden; font-family:'Arial Black',Arial,sans-serif; }
canvas { display:block; }
#ui { position:fixed; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; }
.panel {
  background:rgba(2,0,16,0.95); border:3px solid #6d28d9;
  border-radius:22px; padding:30px 38px; text-align:center; color:#fff;
  pointer-events:all; box-shadow:0 0 50px rgba(109,40,217,0.6);
  max-width:340px; width:90%;
}
.panel h1 { font-size:2rem; color:#f0c040; text-shadow:0 0 20px #f0c040; margin-bottom:4px; }
.panel .sub { font-size:0.8rem; color:#a855f7; letter-spacing:3px; margin-bottom:16px; }
.panel p { font-size:0.9rem; color:#c4b5fd; line-height:1.65; margin-bottom:20px; }
.btn {
  display:block; width:100%; padding:14px; border:none; border-radius:14px;
  font-family:'Arial Black',Arial,sans-serif; font-size:1.1rem; cursor:pointer;
  background:linear-gradient(135deg,#5b21b6,#7c3aed); color:#fff;
  box-shadow:0 4px 24px rgba(124,58,237,0.5); letter-spacing:1px; transition:transform .1s;
}
.btn:active { transform:scale(.95); }
#hud {
  position:fixed; top:0; left:0; right:0; padding:10px 18px;
  display:none; justify-content:space-between; align-items:center;
  background:linear-gradient(#020010cc,transparent); pointer-events:none;
}
#hud span { color:#f0c040; font-size:1rem; text-shadow:0 0 10px #f0c040; }
#hint {
  position:fixed; bottom:120px; left:0; right:0; text-align:center;
  color:rgba(240,192,64,0.9); font-size:0.95rem; display:none;
  text-shadow:0 0 10px #f0c040; pointer-events:none;
  animation: pulse 0.9s ease-in-out infinite alternate;
}
@keyframes pulse { from{opacity:.7} to{opacity:1} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="intro" class="panel">
    <h1>🚀 1×1 Runner</h1>
    <p class="sub">MATHE SPACE GAME</p>
    <p>Steuere dein <b style="color:#60a5fa">Raumschiff</b>!<br>
    Wähle beim Tor den Faktor ← → —<br>
    das Schiff wächst mit!<br><br>
    Tippe dann auf das <b style="color:#10b981">richtige Ergebnis</b>.</p>
    <button class="btn" onclick="startGame()">▶ STARTEN</button>
  </div>
  <div id="go-panel" class="panel" style="display:none">
    <div style="font-size:2.8rem">💥</div>
    <h1 style="color:#ef4444;font-size:1.6rem">Falsch!</h1>
    <p id="go-text"></p>
    <button class="btn" onclick="startGame()">↩ Nochmal</button>
  </div>
</div>
<div id="hud">
  <span id="round-txt">Runde 1</span>
  <span id="score-txt">⭐ 0</span>
</div>
<div id="hint">👆 Tippe auf das richtige Ergebnis!</div>

<script>
// ── CANVAS ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

// ── AUDIO ─────────────────────────────────────────────────────────────────────
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type='sine', vol=0.2) {
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sndGrow()  { beep(440,0.08,'square',0.15); beep(660,0.1,'sine',0.18); }
function sndShoot() { beep(1200,0.04,'square',0.16); setTimeout(()=>beep(500,0.08,'sine',0.1),45); }
function sndWin()   { [523,659,784,1047,1319,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'square',0.13),i*65)); }
function sndLose()  { [440,330,220,160,120].forEach((f,i)=>setTimeout(()=>beep(f,0.16,'sawtooth',0.18),i*100)); }

// ── PSEUDO-3D HELPERS ─────────────────────────────────────────────────────────
function horizonY() { return H * 0.27; }
function shipBaseY() { return H * 0.68; }   // nose tip Y

function roadWidthAt(y) {
  const t = Math.max(0, (y - horizonY()) / (H - horizonY()));
  return W * (0.05 + 0.95 * t);
}
function roadLeftAt(y) { return W/2 - roadWidthAt(y)/2; }
function pFactor(y) {
  return Math.max(0, Math.min(1.4, (y - horizonY()) / (shipBaseY() - horizonY())));
}

// ── CONSTANTS ────────────────────────────────────────────────────────────────
const SEG_W   = 20;
const SEG_H   = 17;
const NOSE_H  = 30;
const NUM_DOORS = 6;
const CONFETTI = ['#f0c040','#10b981','#60a5fa','#f87171','#c084fc','#fb923c','#34d399','#a78bfa','#fbbf24','#e879f9'];

// ── SPEED / DIFFICULTY ───────────────────────────────────────────────────────
function speed()     { return 1.0 + streak * 0.038; }
function maxFactor() {
  if (streak < 6)  return 3;
  if (streak < 12) return 4;
  if (streak < 20) return 5;
  if (streak < 30) return 6;
  if (streak < 42) return 7;
  if (streak < 56) return 8;
  return 9;
}
function randomFactor() {
  const mx = maxFactor();
  return 2 + Math.floor(Math.random() * (mx - 1));
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let state = 'intro';
let round = 0, streak = 0, totalScore = 0;
let ship, obstacles, particles, floatTexts, rings;
let factorA = null, factorB = null, correctAnswer = null;
let pendingWall = null, doorAnswers = [];
let wallArmed = false;
let shakeT = 0, flashClr = '#fff', flashA = 0;
let celebrateTimer = 0;
let bgScroll = 0, t = 0;
let shipFlash = 0;

// ── SHIP ─────────────────────────────────────────────────────────────────────
function initShip() {
  ship = { x: W/2, targetX: W/2, rows: 0, cols: 1 };
}

function drawShip() {
  const cx   = ship.x;
  const baseY = shipBaseY();
  const rows = ship.rows;
  const cols = ship.cols;
  const noseW = Math.max(SEG_W, cols * SEG_W * 0.55);
  const totalW = cols * SEG_W;
  const bx0   = cx - totalW / 2;

  const flash = shipFlash > 0;
  const hull   = flash ? '#fde68a' : '#1d4ed8';
  const hullLt = flash ? '#fef3c7' : '#3b82f6';
  const hullBd = flash ? '#f0c040' : '#60a5fa';

  // Engine flames (bottom of each column)
  if (rows > 0) {
    const engineY = baseY + rows * SEG_H;
    for (let c = 0; c < cols; c++) {
      const ex = bx0 + c * SEG_W + SEG_W / 2;
      const flameH = 10 + Math.sin(t * 0.15 + c) * 6;
      const fg = ctx.createLinearGradient(ex, engineY, ex, engineY + flameH + 12);
      fg.addColorStop(0, 'rgba(168,85,247,0.9)');
      fg.addColorStop(0.4, 'rgba(251,146,60,0.8)');
      fg.addColorStop(1, 'rgba(251,146,60,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(ex - SEG_W*0.38, engineY);
      ctx.lineTo(ex + SEG_W*0.38, engineY);
      ctx.lineTo(ex, engineY + flameH + 12);
      ctx.closePath(); ctx.fill();
    }
  }

  // Body segments (draw back rows first)
  for (let r = rows - 1; r >= 0; r--) {
    const ry = baseY + r * SEG_H;
    const depth = 1 - r * 0.04;
    for (let c = 0; c < cols; c++) {
      const sx = bx0 + c * SEG_W;
      // Hull block
      ctx.fillStyle = hull;
      ctx.globalAlpha = depth;
      ctx.fillRect(sx + 2, ry + 1, SEG_W - 4, SEG_H - 2);
      // Border glow
      ctx.strokeStyle = hullBd;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(sx + 2, ry + 1, SEG_W - 4, SEG_H - 2);
      // Inner detail line
      ctx.strokeStyle = hullLt;
      ctx.lineWidth = 0.8;
      ctx.strokeRect(sx + 4, ry + 3, SEG_W - 8, SEG_H - 6);
      // Small window circle on top rows
      if (r === 0) {
        ctx.fillStyle = '#bfdbfe';
        ctx.beginPath(); ctx.arc(sx + SEG_W/2, ry + SEG_H*0.45, 3, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // Wing extensions (appear when cols > 1)
  if (cols > 1) {
    const wingY = baseY + (rows > 0 ? Math.min(rows-1, 1) * SEG_H : 0);
    const wW = SEG_W * 0.7, wH = SEG_H * 0.7;
    ctx.fillStyle = flash ? '#fde68a' : '#1e40af';
    ctx.globalAlpha = 0.85;
    // Left wing
    ctx.beginPath();
    ctx.moveTo(bx0, wingY); ctx.lineTo(bx0 - wW, wingY + wH);
    ctx.lineTo(bx0, wingY + wH); ctx.closePath(); ctx.fill();
    // Right wing
    ctx.beginPath();
    ctx.moveTo(bx0 + totalW, wingY); ctx.lineTo(bx0 + totalW + wW, wingY + wH);
    ctx.lineTo(bx0 + totalW, wingY + wH); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Nose (pointed forward/upward)
  const noseTipY = baseY - NOSE_H;
  const ng = ctx.createLinearGradient(cx, noseTipY, cx, baseY);
  ng.addColorStop(0, flash ? '#fef9c3' : '#93c5fd');
  ng.addColorStop(1, flash ? '#fde68a' : '#1d4ed8');
  ctx.fillStyle = ng;
  ctx.beginPath();
  ctx.moveTo(cx, noseTipY);
  ctx.lineTo(cx - noseW/2, baseY);
  ctx.lineTo(cx + noseW/2, baseY);
  ctx.closePath(); ctx.fill();

  // Nose glow
  ctx.shadowColor = flash ? '#f0c040' : '#60a5fa';
  ctx.shadowBlur = flash ? 25 : 12;
  ctx.strokeStyle = flash ? '#fef3c7' : '#93c5fd';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx, noseTipY);
  ctx.lineTo(cx - noseW/2, baseY);
  ctx.lineTo(cx + noseW/2, baseY);
  ctx.closePath(); ctx.stroke();
  ctx.shadowBlur = 0;

  // Nose window
  ctx.fillStyle = flash ? '#fef9c3' : '#bfdbfe';
  ctx.beginPath(); ctx.arc(cx, baseY - NOSE_H*0.45, 4, 0, Math.PI*2); ctx.fill();
}

// ── OBSTACLES ─────────────────────────────────────────────────────────────────
function initObstacles() {
  factorA = null; factorB = null; correctAnswer = null;
  doorAnswers = []; wallArmed = false;
  pendingWall = { type:'wall', y:-1300, answer:null, wrongs:[], passed:false };
  obstacles = [
    { type:'choice', y:-280, choices:randomPair(), which:'A', passed:false },
    { type:'choice', y:-720, choices:randomPair(), which:'B', passed:false },
    pendingWall,
  ];
}

function randomPair() {
  const mx = maxFactor();
  const pool = [];
  for (let i=2; i<=mx; i++) pool.push(i);
  const a = pool[Math.floor(Math.random()*pool.length)];
  let b; do { b = pool[Math.floor(Math.random()*pool.length)]; } while(b===a);
  return [a, b];
}

function generateWrongs(correct) {
  const s = new Set();
  [-6,-5,-4,-3,-2,-1,1,2,3,4,5,6,8,-8,12,-12].forEach(d=>{
    const v=correct+d; if(v>1&&v!==correct) s.add(v);
  });
  for (let i=0;i<40&&s.size<20;i++) {
    const v = Math.max(2, Math.round(correct*(0.6+Math.random()*0.8)));
    if(v!==correct) s.add(v);
  }
  return [...s].sort(()=>Math.random()-.5).slice(0, NUM_DOORS-1);
}

function buildDoors(correct, wrongs) {
  return [correct, ...wrongs].sort(()=>Math.random()-.5);
}

// ── DRAW OBSTACLES (PSEUDO-3D) ────────────────────────────────────────────────
function drawChoiceGate(ob) {
  const y  = ob.y;
  const hY = horizonY();
  if (y < hY - 5) return;

  const pf   = pFactor(y);
  const rW   = roadWidthAt(y);
  const rL   = roadLeftAt(y);
  const gH   = Math.max(4, 96 * pf);
  const topY = y - gH;
  const rWt  = roadWidthAt(topY) * Math.min(1.0, pf + 0.12);
  const rLt  = W/2 - rWt/2;

  // Left side (choice[0])
  ctx.fillStyle = ctx.createLinearGradient(rL, topY, rL+rW/2, y);
  const gL = ctx.createLinearGradient(rL, topY, rL, y);
  gL.addColorStop(0,'#1e1b4b'); gL.addColorStop(1,'#2d2b7a');
  ctx.fillStyle = gL;
  ctx.beginPath();
  ctx.moveTo(rLt, topY); ctx.lineTo(rLt+rWt/2, topY);
  ctx.lineTo(rL+rW/2, y); ctx.lineTo(rL, y);
  ctx.closePath(); ctx.fill();

  // Right side (choice[1])
  const gR = ctx.createLinearGradient(rL+rW/2, topY, rL+rW, y);
  gR.addColorStop(0,'#052e16'); gR.addColorStop(1,'#064e3b');
  ctx.fillStyle = gR;
  ctx.beginPath();
  ctx.moveTo(rLt+rWt/2, topY); ctx.lineTo(rLt+rWt, topY);
  ctx.lineTo(rL+rW, y); ctx.lineTo(rL+rW/2, y);
  ctx.closePath(); ctx.fill();

  // Divider
  ctx.strokeStyle = 'rgba(240,192,64,0.6)'; ctx.lineWidth = Math.max(1,2*pf);
  ctx.setLineDash([8*pf, 5*pf]);
  ctx.beginPath(); ctx.moveTo(W/2, topY); ctx.lineTo(W/2, y); ctx.stroke();
  ctx.setLineDash([]);

  // Glow border
  ctx.shadowColor='#7c3aed'; ctx.shadowBlur=14*pf;
  ctx.strokeStyle='#6d28d9'; ctx.lineWidth=Math.max(1,3*pf);
  ctx.strokeRect(rL, topY, rW, gH);
  ctx.shadowBlur=0;

  // Numbers
  const fSize = Math.max(11, Math.round(58*pf));
  ctx.font = `bold ${fSize}px Arial Black`;
  ctx.textAlign = 'center';
  const midY = topY + gH*0.58 + fSize*0.32;

  ctx.strokeStyle='#020010'; ctx.lineWidth=fSize*0.13;
  ctx.strokeText('×'+ob.choices[0], rL+rW*0.25, midY);
  ctx.fillStyle='#c4b5fd'; ctx.fillText('×'+ob.choices[0], rL+rW*0.25, midY);

  ctx.strokeText('×'+ob.choices[1], rL+rW*0.75, midY);
  ctx.fillStyle='#6ee7b7'; ctx.fillText('×'+ob.choices[1], rL+rW*0.75, midY);

  // Side highlight based on ship position
  if (state==='playing' && pf>0.25) {
    ctx.fillStyle = ship.x < W/2 ? 'rgba(99,102,241,0.18)' : 'rgba(16,185,129,0.18)';
    ctx.beginPath();
    if (ship.x < W/2) {
      ctx.moveTo(rLt,topY); ctx.lineTo(rLt+rWt/2,topY); ctx.lineTo(rL+rW/2,y); ctx.lineTo(rL,y);
    } else {
      ctx.moveTo(rLt+rWt/2,topY); ctx.lineTo(rLt+rWt,topY); ctx.lineTo(rL+rW,y); ctx.lineTo(rL+rW/2,y);
    }
    ctx.closePath(); ctx.fill();
  }
}

function drawWall(ob) {
  if (!doorAnswers.length) return;
  const y  = ob.y;
  const hY = horizonY();
  if (y < hY - 5) return;

  const pf   = pFactor(y);
  const rW   = roadWidthAt(y);
  const rL   = roadLeftAt(y);
  const wH   = Math.max(5, 80 * pf);
  const topY = y - wH;
  const dW   = rW / NUM_DOORS;
  const pulse = 0.75 + 0.25 * Math.sin(t * 0.1);

  for (let i=0; i<NUM_DOORS; i++) {
    const dx = rL + i*dW;
    const bg = ctx.createLinearGradient(dx, topY, dx, y);
    bg.addColorStop(0,'#1e1b4b'); bg.addColorStop(1,'#312e81');
    ctx.fillStyle = bg;
    ctx.fillRect(dx, topY, dW, wH);
    ctx.strokeStyle = `rgba(109,40,217,${pulse})`;
    ctx.lineWidth = Math.max(1, 2*pf);
    ctx.strokeRect(dx+1, topY+1, dW-2, wH-2);

    const fSize = Math.max(9, Math.round(35*pf));
    ctx.font = `bold ${fSize}px Arial Black`;
    ctx.textAlign = 'center';
    ctx.strokeStyle='#020010'; ctx.lineWidth=fSize*0.12;
    ctx.strokeText(doorAnswers[i], dx+dW/2, topY+wH*0.62+fSize*0.32);
    ctx.fillStyle='#e9d5ff';
    ctx.fillText(doorAnswers[i], dx+dW/2, topY+wH*0.62+fSize*0.32);
  }

  // Glow border
  ctx.shadowColor='#a855f7'; ctx.shadowBlur=18*pf;
  ctx.strokeStyle='#7c3aed'; ctx.lineWidth=Math.max(2, 4*pf);
  ctx.strokeRect(rL, topY, rW, wH);
  ctx.shadowBlur=0;

  // Equation above
  if (factorA && factorB && pf>0.2) {
    const fe = Math.max(9, Math.round(18*pf));
    ctx.font=`bold ${fe}px Arial Black`;
    ctx.textAlign='center';
    ctx.strokeStyle='#020010'; ctx.lineWidth=fe*0.12;
    ctx.strokeText(`${factorA} × ${factorB} = ?`, W/2, topY - 6*pf);
    ctx.fillStyle='#f0c040';
    ctx.fillText(`${factorA} × ${factorB} = ?`, W/2, topY - 6*pf);
  }
}

// ── COLLISION ─────────────────────────────────────────────────────────────────
function updateObstacles() {
  const spd = speed();
  obstacles.forEach(ob => ob.y += spd);
  bgScroll += spd;

  obstacles.forEach(ob => {
    if (ob.passed) return;

    if (ob.type === 'choice') {
      const tipY = shipBaseY() - NOSE_H;
      if (ob.y + 96 > tipY - 10 && ob.y < tipY + 20) {
        ob.passed = true;
        const chosen = ship.x < W/2 ? ob.choices[0] : ob.choices[1];

        if (ob.which === 'A') {
          factorA = chosen;
          ship.rows = chosen;
          shipFlash = 18;
          sndGrow();
          spawnFloat('×'+chosen, ship.x, shipBaseY()-60, '#c4b5fd');
          burst(ship.x, shipBaseY()-20, 18, CONFETTI);
        } else {
          factorB = chosen;
          ship.cols = chosen;
          shipFlash = 18;
          sndGrow();
          spawnFloat('×'+chosen, ship.x, shipBaseY()-60, '#6ee7b7');
          burst(ship.x, shipBaseY()-20, 18, CONFETTI);
          correctAnswer = factorA * factorB;
          doorAnswers = buildDoors(correctAnswer, generateWrongs(correctAnswer));
        }
      }
    }

    if (ob.type === 'wall') {
      if (doorAnswers.length && ob.y > horizonY()+50 && !wallArmed) {
        wallArmed = true;
        document.getElementById('hint').style.display = 'block';
      }
      // Fallback: auto-resolve when wall reaches ship nose
      if (doorAnswers.length && ob.y > shipBaseY() - NOSE_H - 10) {
        ob.passed = true;
        document.getElementById('hint').style.display = 'none';
        const rW  = roadWidthAt(ob.y);
        const rL  = roadLeftAt(ob.y);
        const idx = Math.max(0, Math.min(NUM_DOORS-1, Math.floor((ship.x - rL)/(rW/NUM_DOORS))));
        resolve(doorAnswers[idx] ?? doorAnswers[0]);
      }
    }
  });
}

// ── SHOOTING ─────────────────────────────────────────────────────────────────
function handleTap(cx, cy) {
  if (state !== 'playing') return;
  if (!wallArmed || !doorAnswers.length) return;
  const wall = obstacles.find(ob => ob.type==='wall' && !ob.passed);
  if (!wall) return;

  wall.passed = true;
  document.getElementById('hint').style.display = 'none';
  sndShoot();

  const rW  = roadWidthAt(wall.y);
  const rL  = roadLeftAt(wall.y);
  const idx = Math.max(0, Math.min(NUM_DOORS-1, Math.floor((cx - rL)/(rW/NUM_DOORS))));
  ship.targetX = rL + (idx + 0.5) * (rW / NUM_DOORS);

  // Shoot particles upward
  for (let i=0;i<20;i++) {
    const angle = -Math.PI/2 + (Math.random()-.5)*0.9;
    particles.push({ x:ship.x, y:shipBaseY()-NOSE_H,
      vx:Math.cos(angle)*(3+Math.random()*5), vy:Math.sin(angle)*(3+Math.random()*5)-2,
      color:CONFETTI[i%CONFETTI.length], life:1, size:4+Math.random()*5 });
  }

  setTimeout(() => resolve(doorAnswers[idx] ?? doorAnswers[0]), 200);
}

function resolve(chosen) {
  if (state !== 'playing') return;
  if (chosen === correctAnswer) celebrate();
  else gameOver(chosen);
}

// ── PARTICLES & RINGS ────────────────────────────────────────────────────────
function burst(x, y, n, colors) {
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, s=2+Math.random()*8;
    particles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-3,
      color:colors[i%colors.length], life:1, size:3+Math.random()*7 });
  }
}

function bigFireworks() {
  const pts = [[W*.15,H*.3],[W*.5,H*.18],[W*.85,H*.3],[W*.3,H*.5],[W*.7,H*.5],[W*.5,H*.6]];
  pts.forEach(([x,y],i) => {
    setTimeout(()=>{
      burst(x,y,28,CONFETTI);
      rings.push({x,y,r:8,maxR:160,color:CONFETTI[i%CONFETTI.length],alpha:1});
    }, i*80);
  });
  // Extra center explosion
  setTimeout(()=>burst(W/2, H*0.38, 40, CONFETTI), 200);
}

function spawnFloat(text, x, y, color) {
  floatTexts.push({ x,y,text,color,life:1,vy:-1.6 });
}

function tickParticles() {
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.02; });
  floatTexts = floatTexts.filter(f=>f.life>0);
  floatTexts.forEach(f=>{ f.y+=f.vy; f.life-=0.015; });
  rings = rings.filter(r=>r.alpha>0);
  rings.forEach(r=>{ r.r+=7; r.alpha=Math.max(0,1-r.r/r.maxR); });
}

function drawStar(cx,cy,r,r2,spk) {
  let a=-Math.PI/2, s=Math.PI/spk;
  ctx.beginPath(); ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  for(let i=0;i<spk;i++){a+=s;ctx.lineTo(cx+r2*Math.cos(a),cy+r2*Math.sin(a));a+=s;ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}
  ctx.closePath(); ctx.fill();
}

function drawParticles() {
  rings.forEach(r=>{
    ctx.globalAlpha=r.alpha*0.55; ctx.strokeStyle=r.color;
    ctx.lineWidth=3; ctx.shadowColor=r.color; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.stroke();
    ctx.shadowBlur=0;
  });
  particles.forEach(p=>{
    ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
    const r=p.size*p.life;
    if(p.life>0.55) drawStar(p.x,p.y,r,r*0.42,5);
    else { ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill(); }
  });
  ctx.globalAlpha=1;
  floatTexts.forEach(f=>{
    ctx.globalAlpha=f.life; ctx.textAlign='center';
    ctx.font='bold 28px Arial Black';
    ctx.strokeStyle='#020010'; ctx.lineWidth=5;
    ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y);
    ctx.globalAlpha=1;
  });
}

// ── BACKGROUND ────────────────────────────────────────────────────────────────
function drawBackground() {
  const hY = horizonY();

  // Sky
  const sky = ctx.createLinearGradient(0,0,0,hY);
  sky.addColorStop(0,'#010008'); sky.addColorStop(1,'#0d0028');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,hY);

  // Stars
  for (let i=0;i<30;i++) {
    const sx=((i*137.5+t*0.01)%W+W)%W;
    const sy=((i*97+bgScroll*0.015)%hY+hY)%hY;
    const br=0.4+0.6*Math.abs(Math.sin(i+t*0.005));
    ctx.fillStyle=`rgba(255,255,255,${br})`;
    ctx.beginPath(); ctx.arc(sx,sy,0.8,0,Math.PI*2); ctx.fill();
  }
  // A few bigger stars
  for (let i=0;i<5;i++) {
    const sx=((i*211+50)%W+W)%W;
    const sy=(i*53+30)%hY;
    ctx.fillStyle='rgba(200,200,255,0.7)';
    ctx.beginPath(); ctx.arc(sx,sy,1.5,0,Math.PI*2); ctx.fill();
  }

  // Road strips (perspective trapezoids)
  const SEGS = 20;
  for (let i=0;i<SEGS;i++) {
    const t1=i/SEGS, t2=(i+1)/SEGS;
    const y1=hY+(H-hY)*t1, y2=hY+(H-hY)*t2;
    const rL1=roadLeftAt(y1), rW1=roadWidthAt(y1);
    const rL2=roadLeftAt(y2), rW2=roadWidthAt(y2);
    const even=(Math.floor(i+bgScroll*0.045)%2)===0;

    // Grass
    ctx.fillStyle=even ? '#0a1f06' : '#0d2908';
    ctx.beginPath(); ctx.moveTo(0,y1); ctx.lineTo(rL1,y1); ctx.lineTo(rL2,y2); ctx.lineTo(0,y2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(rL1+rW1,y1); ctx.lineTo(W,y1); ctx.lineTo(W,y2); ctx.lineTo(rL2+rW2,y2); ctx.fill();

    // Road
    ctx.fillStyle=even ? '#0c0a24' : '#110e2e';
    ctx.beginPath(); ctx.moveTo(rL1,y1); ctx.lineTo(rL1+rW1,y1); ctx.lineTo(rL2+rW2,y2); ctx.lineTo(rL2,y2); ctx.fill();
  }

  // Road edges glowing
  ctx.shadowColor='#7c3aed'; ctx.shadowBlur=22;
  ctx.strokeStyle='#5b21b6'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(W/2,hY); ctx.lineTo(roadLeftAt(H),H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2,hY); ctx.lineTo(roadLeftAt(H)+roadWidthAt(H),H); ctx.stroke();
  ctx.shadowBlur=0;

  // Dashed center
  ctx.strokeStyle='rgba(240,192,64,0.28)'; ctx.lineWidth=2;
  ctx.setLineDash([28,22]); ctx.lineDashOffset=-bgScroll*0.85;
  ctx.beginPath(); ctx.moveTo(W/2,hY); ctx.lineTo(W/2,H); ctx.stroke();
  ctx.setLineDash([]);
}

// ── WIN / GAMEOVER ────────────────────────────────────────────────────────────
function celebrate() {
  state='celebrate';
  streak++; totalScore += 10 + streak;
  flashClr='#10b981'; flashA=0.45;
  bigFireworks();
  sndWin();
  spawnFloat(`${factorA}×${factorB}=${correctAnswer} ✓`, W/2, H*0.45, '#f0c040');
  document.getElementById('score-txt').textContent='⭐ '+totalScore;
  celebrateTimer=45;  // ~0.75s then auto-continue
}

function gameOver(chosen) {
  state='gameover';
  flashClr='#ef4444'; flashA=0.7;
  shakeT=22; streak=0;
  sndLose();
  const txt = factorA&&factorB
    ? `${factorA} × ${factorB} = ${correctAnswer}\nDu hast ${chosen} getippt.`
    : 'Nicht ganz!';
  document.getElementById('go-text').textContent=txt;
  document.getElementById('go-panel').style.display='none';
  setTimeout(()=>document.getElementById('go-panel').style.display='',650);
  document.getElementById('hud').style.display='none';
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
let dragX=null, keys={};
window.addEventListener('keydown',e=>{ keys[e.key]=true; ensureAudio(); });
window.addEventListener('keyup',  e=>{ keys[e.key]=false; });

canvas.addEventListener('touchstart',e=>{
  e.preventDefault(); ensureAudio();
  dragX=e.touches[0].clientX;
  if (wallArmed) handleTap(dragX, e.touches[0].clientY);
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault(); dragX=e.touches[0].clientX;
  if (state==='playing'&&!wallArmed) ship.targetX=dragX;
},{passive:false});
canvas.addEventListener('touchend',()=>{ dragX=null; },{passive:false});

canvas.addEventListener('mousedown',e=>{
  ensureAudio(); dragX=e.clientX;
  if (wallArmed) handleTap(e.clientX,e.clientY);
  else if(state==='playing') ship.targetX=e.clientX;
});
canvas.addEventListener('mousemove',e=>{
  if(e.buttons&&state==='playing'&&!wallArmed){ dragX=e.clientX; ship.targetX=dragX; }
});
canvas.addEventListener('mouseup',()=>{ dragX=null; });

// ── GAME LOOP ─────────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  t++;

  let sx=0,sy=0;
  if(shakeT>0){ sx=(Math.random()-.5)*12; sy=(Math.random()-.5)*12; shakeT--; }
  ctx.save(); if(sx||sy) ctx.translate(sx,sy);

  drawBackground();

  if (state==='playing'||state==='celebrate') {
    if (!wallArmed) {
      const rW=roadWidthAt(shipBaseY()), rL=W/2-rW/2;
      if(dragX!==null) ship.targetX=dragX;
      if(keys['ArrowLeft']||keys['a']||keys['A']) ship.targetX-=7;
      if(keys['ArrowRight']||keys['d']||keys['D']) ship.targetX+=7;
      ship.targetX=Math.max(rL+35, Math.min(rL+rW-35, ship.targetX));
    }
    ship.x += (ship.targetX - ship.x) * 0.13;
    if(shipFlash>0) shipFlash--;

    if(state==='playing') updateObstacles();
    tickParticles();

    if(state==='celebrate') {
      celebrateTimer--;
      if(celebrateTimer<=0) startRound();
    }
  }

  if (state!=='intro') {
    [...obstacles].sort((a,b)=>a.y-b.y).forEach(ob=>{
      if(ob.type==='choice') drawChoiceGate(ob);
      if(ob.type==='wall')   drawWall(ob);
    });
    drawParticles();
    drawShip();
  }

  // Flash overlay
  if(flashA>0){
    ctx.fillStyle=flashClr; ctx.globalAlpha=flashA;
    ctx.fillRect(-10,-10,W+20,H+20);
    ctx.globalAlpha=1; flashA=Math.max(0,flashA-0.032);
  }

  ctx.restore();
}

// ── CONTROL ───────────────────────────────────────────────────────────────────
function startGame() {
  round=0; streak=0; totalScore=0;
  document.getElementById('intro').style.display='none';
  document.getElementById('go-panel').style.display='none';
  document.getElementById('hud').style.display='flex';
  startRound(); ensureAudio();
}

function startRound() {
  round++;
  particles=[]; floatTexts=[]; rings=[]; bgScroll=0;
  dragX=null; wallArmed=false; shipFlash=0;
  document.getElementById('hint').style.display='none';
  document.getElementById('go-panel').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('round-txt').textContent='Runde '+round;
  document.getElementById('score-txt').textContent='⭐ '+totalScore;
  initShip();
  initObstacles();
  state='playing';
}

loop();
</script>
