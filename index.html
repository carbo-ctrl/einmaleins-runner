<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0020">
<title>Einmaleins Runner ⚡</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0020; overflow:hidden; font-family:'Arial Black',Arial,sans-serif; }
  canvas { display:block; touch-action:none; }
  #ui {
    position:fixed; top:0; left:0; right:0; bottom:0;
    pointer-events:none; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .panel {
    background:rgba(10,0,32,0.92); border:3px solid #a855f7;
    border-radius:20px; padding:28px 36px; text-align:center;
    color:#fff; pointer-events:all;
    box-shadow:0 0 40px rgba(168,85,247,0.5);
    max-width:340px; width:90%;
  }
  .panel h1 { font-size:2rem; color:#f0c040; text-shadow:0 0 20px #f0c040; margin-bottom:6px; }
  .panel .sub { font-size:0.85rem; color:#a855f7; letter-spacing:2px; margin-bottom:18px; }
  .panel p  { font-size:0.95rem; color:#c4b5fd; line-height:1.6; margin-bottom:18px; }
  .btn {
    display:block; width:100%; padding:14px; border:none; border-radius:12px;
    font-family:'Arial Black',Arial,sans-serif; font-size:1.1rem;
    cursor:pointer; transition:transform .1s, box-shadow .1s;
    background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff;
    box-shadow:0 4px 20px rgba(168,85,247,0.5); letter-spacing:1px;
  }
  .btn:active { transform:scale(.96); }
  .btn.green { background:linear-gradient(135deg,#059669,#10b981); box-shadow:0 4px 20px rgba(16,185,129,.5); }
  .score-bar {
    position:fixed; top:0; left:0; right:0; padding:10px 16px;
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:none;
    background:linear-gradient(#0a0020dd,transparent);
  }
  .score-bar span { color:#f0c040; font-size:1rem; text-shadow:0 0 10px #f0c040; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <!-- INTRO -->
  <div id="intro" class="panel">
    <h1>⚡ 1×1 Runner</h1>
    <p class="sub">MATHE ACTION GAME</p>
    <p>Laufe durch die <b style="color:#f0c040">Zahlen</b> und multipliziere deine Truppe!<br>
    Wähle am Ende das <b style="color:#10b981">richtige Ergebnis</b> — sonst ist es vorbei!</p>
    <button class="btn" onclick="startGame()">▶ SPIELEN</button>
  </div>

  <!-- WIN -->
  <div id="win-panel" class="panel" style="display:none">
    <div style="font-size:3rem">🎉</div>
    <h1 style="font-size:1.6rem" id="win-title">Richtig!</h1>
    <p id="win-text"></p>
    <button class="btn green" onclick="nextLevel()">Weiter →</button>
  </div>

  <!-- GAMEOVER -->
  <div id="go-panel" class="panel" style="display:none">
    <div style="font-size:3rem">💥</div>
    <h1 style="color:#ef4444;font-size:1.6rem">Falsch!</h1>
    <p id="go-text"></p>
    <button class="btn" onclick="startGame()">↩ Nochmal</button>
  </div>
</div>

<div class="score-bar" id="score-bar" style="display:none">
  <span id="level-txt">Level 1</span>
  <span id="score-txt">⭐ 0</span>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CANVAS SETUP
// ─────────────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

// ─────────────────────────────────────────────────────────────────────────────
// GAME STATE
// ─────────────────────────────────────────────────────────────────────────────
let state     = 'intro';   // intro | playing | win | gameover
let level     = 0;
let totalScore= 0;
let crowd, obstacles, particles, bgOffset, inputX;
let factorA, factorB, correctAnswer;
let shakeT    = 0;
let flashClr  = null, flashA = 0;

// ─────────────────────────────────────────────────────────────────────────────
// LEVEL DATA  (factorA, factorB pairs — gets harder)
// ─────────────────────────────────────────────────────────────────────────────
const LEVELS = [
  [2,2],[2,3],[2,4],[3,3],[2,5],[3,4],[2,6],[3,5],[4,4],
  [2,7],[3,6],[4,5],[2,8],[3,7],[4,6],[5,5],[3,8],[4,7],
  [5,6],[3,9],[4,8],[5,7],[6,6],[4,9],[5,8],[6,7],[5,9],
  [6,8],[7,7],[6,9],[7,8],[7,9],[8,8],[8,9],[9,9],
];

// ─────────────────────────────────────────────────────────────────────────────
// CROWD
// ─────────────────────────────────────────────────────────────────────────────
const PERSON_COLORS = ['#f87171','#60a5fa','#4ade80','#fbbf24','#c084fc','#34d399','#fb923c','#a78bfa'];

function makePerson(idx, count) {
  // Formation: spread in rows
  const cols = Math.min(count, 7);
  const row  = Math.floor(idx / cols);
  const col  = idx % cols;
  const rowCount = Math.ceil(count / cols);
  return {
    ox:    (col - (Math.min(count, cols) - 1) / 2) * 18,
    oy:    -(row * 22),
    color: PERSON_COLORS[idx % PERSON_COLORS.length],
    phase: Math.random() * Math.PI * 2,
  };
}

function initCrowd() {
  crowd = {
    count:   1,
    x:       W / 2,
    targetX: W / 2,
    y:       H * 0.78,
    persons: [makePerson(0, 1)],
  };
}

function multiplyCrowd(factor) {
  crowd.count = Math.min(crowd.count * factor, 9999);
  const display = Math.min(crowd.count, 50);
  crowd.persons = [];
  for (let i = 0; i < display; i++) crowd.persons.push(makePerson(i, display));
  // Burst particles
  for (let i = 0; i < 30; i++) spawnParticle(crowd.x, crowd.y - 20, '#f0c040');
}

function drawPerson(x, y, color, phase, t) {
  const bob  = Math.sin(phase + t * 0.008) * 2.5;
  const legA = Math.sin(phase + t * 0.008) * 12;
  y += bob;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y + 14, 6, 2, 0, 0, Math.PI*2); ctx.fill();

  // Legs
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y + 4);  ctx.lineTo(x - 4, y + 14 + legA);  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y + 4);  ctx.lineTo(x + 4, y + 14 - legA);  ctx.stroke();

  // Body
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(x - 5, y - 8, 10, 13, 3); ctx.fill();

  // Head
  ctx.fillStyle = '#fcd34d';
  ctx.beginPath(); ctx.arc(x, y - 13, 6, 0, Math.PI*2); ctx.fill();

  // Eyes
  ctx.fillStyle = '#1e1b4b';
  ctx.beginPath(); ctx.arc(x - 2, y - 14, 1.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 2, y - 14, 1.2, 0, Math.PI*2); ctx.fill();
}

function drawCrowd(t) {
  crowd.persons.forEach(p => {
    drawPerson(crowd.x + p.ox, crowd.y + p.oy, p.color, p.phase, t);
  });
  // Kein Ergebnis anzeigen — Spieler muss selbst rechnen!
}

// ─────────────────────────────────────────────────────────────────────────────
// OBSTACLES
// ─────────────────────────────────────────────────────────────────────────────
const SPEED       = 3.2;
const GATE_H      = 80;
const GATE_GAP    = 120;
const WALL_H      = 60;
const NUM_DOORS   = 6;

function spawnObstacles(fA, fB, correct) {
  const answer = correct;
  // Wrong answers: plausible distractors
  const wrongs = generateWrongs(answer);

  obstacles = [
    { type:'gate', y: -200, factor: fA, passed: false },
    { type:'gate', y: -600, factor: fB, passed: false },
    { type:'wall', y: -1100, answer, wrongs, passed: false },
  ];
}

function generateWrongs(correct) {
  const pool = new Set();
  // Nearby ±1, ±2, common mistakes
  [-3,-2,-1,1,2,3,5,-5,10,-10].forEach(d => {
    const v = correct + d;
    if (v > 0 && v !== correct) pool.add(v);
  });
  // Also some random multiples in range
  for (let i = 0; i < 20 && pool.size < 20; i++) {
    const v = Math.max(1, correct + Math.floor((Math.random() - .5) * correct * .6));
    if (v !== correct) pool.add(v);
  }
  const arr = [...pool];
  arr.sort(() => Math.random() - .5);
  return arr.slice(0, NUM_DOORS - 1);
}

function updateObstacles() {
  obstacles.forEach(ob => { ob.y += SPEED; });
}

function checkCollisions() {
  obstacles.forEach(ob => {
    if (ob.passed) return;
    if (ob.type === 'gate') {
      // Gate is centered: gap in the middle
      const gateY = ob.y;
      if (gateY + GATE_H > crowd.y - 30 && gateY < crowd.y + 10) {
        // Within gate Y range — check if crowd.x is in gap
        const gapL = W/2 - GATE_GAP/2;
        const gapR = W/2 + GATE_GAP/2;
        if (crowd.x > gapL && crowd.x < gapR) {
          ob.passed = true;
          multiplyCrowd(ob.factor);
          flashClr = '#f0c040'; flashA = 0.5;
          spawnMultiText(ob.factor);
        }
      }
    }
    if (ob.type === 'wall') {
      const wallY = ob.y;
      if (wallY + WALL_H > crowd.y - 20 && wallY < crowd.y + 10) {
        ob.passed = true;
        // Which door?
        const doorW = W / NUM_DOORS;
        const doorIdx = Math.floor(crowd.x / doorW);
        const allAnswers = buildDoorAnswers(ob.answer, ob.wrongs);
        const chosen = allAnswers[Math.max(0, Math.min(NUM_DOORS-1, doorIdx))];
        if (chosen === ob.answer) {
          triggerWin(ob.answer);
        } else {
          triggerGameover(ob.answer, chosen);
        }
      }
    }
  });
}

let doorAnswers = [];
function buildDoorAnswers(correct, wrongs) {
  if (doorAnswers.length) return doorAnswers;
  const pool = [correct, ...wrongs.slice(0, NUM_DOORS - 1)];
  // Shuffle
  pool.sort(() => Math.random() - .5);
  doorAnswers = pool;
  return doorAnswers;
}

// ─────────────────────────────────────────────────────────────────────────────
// DRAWING OBSTACLES
// ─────────────────────────────────────────────────────────────────────────────
function drawGate(ob) {
  const y = ob.y;
  const gapL = W/2 - GATE_GAP/2;
  const gapR = W/2 + GATE_GAP/2;

  // Left wall
  const grad = ctx.createLinearGradient(0, y, 0, y + GATE_H);
  grad.addColorStop(0, '#7c3aed'); grad.addColorStop(1, '#a855f7');
  ctx.fillStyle = grad;
  ctx.fillRect(0, y, gapL, GATE_H);
  // Right wall
  ctx.fillRect(gapR, y, W - gapR, GATE_H);

  // Glow on edges
  ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 20;
  ctx.strokeStyle = '#c084fc'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(gapL, y); ctx.lineTo(gapL, y+GATE_H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(gapR, y); ctx.lineTo(gapR, y+GATE_H); ctx.stroke();
  ctx.shadowBlur = 0;

  // Number sign above gap
  const numY = y - 10;
  ctx.fillStyle = '#f0c040';
  ctx.font = 'bold 44px Arial Black';
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#0a0020'; ctx.lineWidth = 5;
  ctx.strokeText('×' + ob.factor, W/2, numY);
  ctx.fillText('×' + ob.factor, W/2, numY);

  // Stars/sparkles on walls
  [gapL/2, (gapR + W)/2].forEach(sx => {
    ctx.fillStyle = '#e879f9';
    ctx.font = '18px Arial';
    ctx.fillText('✦', sx, y + GATE_H/2);
  });
}

function drawWall(ob) {
  const y   = ob.y;
  const dW  = W / NUM_DOORS;
  const answers = buildDoorAnswers(ob.answer, ob.wrongs);

  for (let i = 0; i < NUM_DOORS; i++) {
    const x = i * dW;

    // Alle Felder identisch — kein Hinweis welches richtig ist!
    const g = ctx.createLinearGradient(x, y, x+dW, y+WALL_H);
    g.addColorStop(0, '#1e1b4b');
    g.addColorStop(1, '#312e81');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, dW, WALL_H);

    // Einheitlicher Rahmen
    ctx.strokeStyle = '#6d28d9';
    ctx.lineWidth = 2; ctx.strokeRect(x+1, y+1, dW-2, WALL_H-2);

    // Zahl — alle gleiche Farbe
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px Arial Black';
    ctx.fillStyle = '#e9d5ff';
    ctx.strokeStyle = '#0a0020'; ctx.lineWidth = 4;
    ctx.strokeText(answers[i], x + dW/2, y + WALL_H/2 + 10);
    ctx.fillText(answers[i], x + dW/2, y + WALL_H/2 + 10);
  }

  // Glow border
  ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 15;
  ctx.strokeStyle = '#7c3aed'; ctx.lineWidth = 3;
  ctx.strokeRect(0, y, W, WALL_H);
  ctx.shadowBlur = 0;

  // Gleichung oben anzeigen (ohne Ergebnis)
  ctx.textAlign = 'center'; ctx.font = 'bold 15px Arial Black';
  ctx.fillStyle = '#f0c040';
  ctx.strokeStyle = '#0a0020'; ctx.lineWidth = 3;
  const eq = factorA + ' × ' + factorB + ' = ?';
  ctx.strokeText(eq, W/2, y - 10);
  ctx.fillText(eq, W/2, y - 10);
}

// ─────────────────────────────────────────────────────────────────────────────
// PARTICLES
// ─────────────────────────────────────────────────────────────────────────────
function spawnParticle(x, y, color) {
  const angle = Math.random() * Math.PI * 2;
  const speed = 2 + Math.random() * 5;
  particles.push({
    x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 3,
    color, life: 1, size: 4 + Math.random()*6,
  });
}

let multiTexts = [];
function spawnMultiText(factor) {
  multiTexts.push({ x: crowd.x, y: crowd.y - 60, text: '×'+factor+'  🎉', life: 1 });
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.life -= 0.025;
  });
  multiTexts = multiTexts.filter(t => t.life > 0);
  multiTexts.forEach(t => { t.y -= 1.5; t.life -= 0.02; });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  multiTexts.forEach(t => {
    ctx.globalAlpha = t.life;
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px Arial Black';
    ctx.fillStyle = '#f0c040';
    ctx.strokeStyle = '#0a0020'; ctx.lineWidth = 4;
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha = 1;
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// BACKGROUND
// ─────────────────────────────────────────────────────────────────────────────
function drawBackground(t) {
  // Deep space gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0020'); bg.addColorStop(1, '#1e0040');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Scrolling neon grid
  ctx.strokeStyle = 'rgba(168,85,247,0.15)';
  ctx.lineWidth = 1;
  const gridSize = 60;
  const off = bgOffset % gridSize;

  // Vertical lines
  for (let x = 0; x <= W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  // Horizontal lines (scrolling)
  for (let y = -gridSize + off; y <= H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Road lane markers
  const laneW = 6;
  ctx.strokeStyle = 'rgba(248,250,252,0.08)'; ctx.lineWidth = laneW;
  ctx.setLineDash([40, 30]);
  ctx.lineDashOffset = -off * 2;
  [W*0.25, W*0.5, W*0.75].forEach(lx => {
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, H); ctx.stroke();
  });
  ctx.setLineDash([]);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 20; i++) {
    const sx = ((i * 137 + t * 0.02) % W + W) % W;
    const sy = (i * 97 + off * 0.5) % H;
    ctx.beginPath(); ctx.arc(sx, sy, 1, 0, Math.PI*2); ctx.fill();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// WIN / GAMEOVER
// ─────────────────────────────────────────────────────────────────────────────
function triggerWin(answer) {
  state = 'win';
  totalScore += 10 + level;
  flashClr = '#10b981'; flashA = 0.6;
  for (let i = 0; i < 60; i++) setTimeout(() => {
    spawnParticle(Math.random()*W, Math.random()*H*0.5,
      ['#f0c040','#10b981','#60a5fa','#f87171','#c084fc'][Math.floor(Math.random()*5)]);
  }, i * 30);
  const [fA, fB] = LEVELS[level % LEVELS.length];
  document.getElementById('win-title').textContent = `${fA} × ${fB} = ${answer} ✓`;
  document.getElementById('win-text').textContent =
    `Deine Truppe: ${crowd.count} Personen!\nLevel ${level+1} geschafft 🎉`;
  document.getElementById('win-panel').style.display = '';
  document.getElementById('score-bar').style.display = 'none';
  document.getElementById('score-txt').textContent = '⭐ ' + totalScore;
}

function triggerGameover(correct, chosen) {
  state = 'gameover';
  flashClr = '#ef4444'; flashA = 0.7;
  shakeT = 20;
  const [fA, fB] = LEVELS[level % LEVELS.length];
  document.getElementById('go-text').textContent =
    `${fA} × ${fB} = ${correct}\nDu bist durch ${chosen} gelaufen. Nicht ganz!`;
  document.getElementById('go-panel').style.display = 'none';
  setTimeout(() => {
    document.getElementById('go-panel').style.display = '';
  }, 600);
  document.getElementById('score-bar').style.display = 'none';
}

// ─────────────────────────────────────────────────────────────────────────────
// INPUT
// ─────────────────────────────────────────────────────────────────────────────
let keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup',   e => { keys[e.key] = false; });

let touchX = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchX = e.touches[0].clientX;
}, { passive:false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  touchX = e.touches[0].clientX;
}, { passive:false });
canvas.addEventListener('touchend', () => { touchX = null; });

canvas.addEventListener('mousemove', e => {
  if (e.buttons) touchX = e.clientX;
});
canvas.addEventListener('mouseup', () => { touchX = null; });

// ─────────────────────────────────────────────────────────────────────────────
// GAME LOOP
// ─────────────────────────────────────────────────────────────────────────────
let t = 0;
function loop() {
  requestAnimationFrame(loop);
  t++;

  // Screen shake
  let sx = 0, sy = 0;
  if (shakeT > 0) {
    sx = (Math.random()-.5)*12; sy = (Math.random()-.5)*12;
    shakeT--;
  }
  ctx.save();
  if (sx||sy) ctx.translate(sx, sy);

  if (state === 'playing') {
    bgOffset += SPEED;

    // Move crowd
    const margin = 40;
    if (touchX !== null) {
      crowd.targetX = touchX;
    } else {
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) crowd.targetX -= 8;
      if (keys['ArrowRight']|| keys['d'] || keys['D']) crowd.targetX += 8;
    }
    crowd.targetX = Math.max(margin, Math.min(W - margin, crowd.targetX));
    crowd.x += (crowd.targetX - crowd.x) * 0.12;

    updateObstacles();
    checkCollisions();
    updateParticles();
  }

  drawBackground(t);

  if (state === 'playing' || state === 'win' || state === 'gameover') {
    obstacles.forEach(ob => {
      if (ob.type === 'gate') drawGate(ob);
      if (ob.type === 'wall') drawWall(ob);
    });
    drawParticles();
    drawCrowd(t);
  }

  // Flash overlay
  if (flashA > 0) {
    ctx.fillStyle = flashClr;
    ctx.globalAlpha = flashA;
    ctx.fillRect(-10,-10,W+20,H+20);
    ctx.globalAlpha = 1;
    flashA = Math.max(0, flashA - 0.04);
  }

  ctx.restore();
}

// ─────────────────────────────────────────────────────────────────────────────
// START / NEXT LEVEL
// ─────────────────────────────────────────────────────────────────────────────
function startGame() {
  level = 0; totalScore = 0;
  hideAllPanels();
  initRound();
}

function nextLevel() {
  level++;
  hideAllPanels();
  initRound();
}

function initRound() {
  const [fA, fB] = LEVELS[level % LEVELS.length];
  factorA = fA; factorB = fB;
  correctAnswer = fA * fB;
  doorAnswers = [];
  particles = []; multiTexts = [];
  bgOffset = 0;
  touchX = null;

  initCrowd();
  spawnObstacles(fA, fB, correctAnswer);

  document.getElementById('level-txt').textContent  = `Level ${level+1}`;
  document.getElementById('score-txt').textContent  = '⭐ ' + totalScore;
  document.getElementById('score-bar').style.display = '';

  state = 'playing';
}

function hideAllPanels() {
  ['intro','win-panel','go-panel'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
}

loop();
</script>
</body>
</html>
